services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: prepper-postgis
    environment:
      POSTGRES_DB: preppermap
      POSTGRES_USER: prepper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - prepper_pgdata:/var/lib/postgresql/data
      - ../schema/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepper -d preppermap"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: prepper-api
    environment:
      PREPPER_SYNC_DB: /app/data/sync.sqlite3
      PREPPER_TOKENS: ${PREPPER_TOKENS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,tauri://localhost}
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - prepper_api_data:/app/data
    restart: unless-stopped
volumes:
  prepper_pgdata:
  prepper_api_data:
